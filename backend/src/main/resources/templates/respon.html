<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóa đơn</title>
    <!-- Bootstrap CSS -->
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon"/>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            background-color: rgb(198, 198, 198);
            padding-top: 20px;
        }

        .sidebar .nav {
            display: flex;
            flex-direction: column;
        }

        .sidebar .nav a {
            margin: 10px 0;
            background-color: gray;
            border-radius: 15px;
            text-align: center;
            color: white;
            padding: 10px 0;
            display: block;
        }

        .nav a:hover {
            color: blue;
        }

        .bill-list {
            background-color: rgb(244, 243, 243);
            margin-left: 220px;
            padding: 20px;
        }


        /* Checked state styling */
        input[type="radio"]:checked + label.paid {
            color: green;
        }

        input[type="radio"]:checked + label.not-paid {
            color: red;
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
        }

        .table-bordered {
            background-color: white;
        }

        .table th, .table td {
            text-align: center;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

    </style>
</head>

            <nav class="nav flex-column">

                <a th:if="${user.getRole_id()==2 || user.getRole_id()==5}" href="/products">Kho</a>

                        </div>
                        <div class="col-4">

                            </button>
                        </div>
                    </div>
                </div>
            </div>

                <strong th:text="${success}"></strong>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- Display error message -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong th:text="${error}"></strong>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div id="success-message" th:if="${message}" class="alert alert-success" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

<!-- Bill Detail Modal -->
<div class="modal fade" id="billDetailModal" tabindex="-1" role="dialog" aria-labelledby="billDetailModalLabel"
     aria-hidden="true">
    <div class="modal-dialog custom-width" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="billDetailModalLabel">Chi tiết đơn hàng</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Content will be loaded here via AJAX -->
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id = "complainModal" tabindex="-1" aria-labelledby="complainModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="complainModalLabel">Phản hồi khách hàng</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="complainModalForm" th:action="@{/respon/complain}" method="post" enctype="multipart/form-data">
                    <input type="hidden" id="fid" name="fid"/>
                    <input type="hidden" id="status" name="status"/>
                    <input type="hidden" id="userId" name="userId"/>

                    <div class="form-group">
                        <label for="complain">Phàn nàn của khách hàng:</label>
                        <textarea class="form-control" id="complain" name="complain" rows="3" readonly></textarea>
                    </div>

                    <div class="form-group">
                        <label for="respon">Phản hồi:</label>
                        <textarea class="form-control" id="respon" name="respon" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Phản hồi</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.6.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    $(document).ready(function () {
        $('#billDetailModal').on('show.bs.modal', function (event) {
            var button = $(event.relatedTarget); // Button that triggered the modal
            var billId = button.data('bill-id'); // Extract info from data-* attributes

            var modal = $(this);
            // Use AJAX to fetch bill details
            $.ajax({
                url: '/management/billdetail/' + billId,
                method: 'GET',
                success: function (response) {
                    modal.find('.modal-body').html(response); // Insert response HTML into modal body
                },
                error: function () {
                    modal.find('.modal-body').html('<p>Lỗi tải chi tiết hóa đơn.</p>');
                }
            });
        });

        $('.btn-complain').click(function (){
            var fid = $(this).data('fid');
            var userId = $(this).data('userId')
            var username = $(this).data('username');
            var billId = $(this).data('billId');
            var createdTime = $(this).data('createdTime');
            var status = $(this).data('status');
            var complain = $(this).data('complain');
            var respon = $(this).data('respon');

            $('#fid').val(fid);
            $('#userId').val(userId);
            $('#status').val(status);
            $('#billId').val(billId);
            $('#createdTime').val(createdTime);
            $('#complain').val(complain);
            $('#respon').val(respon);

            $('#complainModal').modal('show');
        });

        $('#complainModal').submit(function (event){
            var respon = $('#respon').val().trim();
            var isValid = true;

            if(respon === "" || respon === null){
                alert("Phản hồi khách hàng đi thì nhấn 'Phản hồi'");
            }

            if (!isValid) {
                event.preventDefault();
            }
        });
    });
</script>
